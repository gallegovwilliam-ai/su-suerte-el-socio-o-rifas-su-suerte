<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Su Suerte El Socio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</head>

<body>

    <nav class="navbar navbar-dark bg-success">

        <div class="container-fluid">

            <span class="navbar-brand mb-0 h1">

                🎰 SU SUERTE EL SOCIO

            </span>

            <span class="text-white">

                WhatsApp

                +591 67723609

            </span>

        </div>

    </nav>

    <div class="container mt-4">

        <div class="row">

            <div class="col-md-4">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h5>Disponibles</h5>

                        <h2 id="libres">10000</h2>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h5>Seleccionados</h5>

                        <h2 id="seleccionados">0</h2>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h5>Vendidos</h5>

                        <h2 id="vendidos">0</h2>

                    </div>

                </div>

            </div>

        </div>

        <div class="mt-4">

            <input type="file"
                   id="archivo"
                   class="form-control">

        </div>

        <div class="mt-3">

            <input type="text"
                   id="buscar"
                   class="form-control"
                   placeholder="Buscar número...">

        </div>

         <button id="copiar" class="btn btn-primary">
        📋 Copiar
    </button>

    <button id="whatsapp" class="btn btn-success">
        📱 WhatsApp
    </button>

    <button id="confirmar" class="btn btn-warning">
        ✅ Confirmar Venta
    </button>

</div>
        <hr>

        <div id="numeros" class="grid mt-4">

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
