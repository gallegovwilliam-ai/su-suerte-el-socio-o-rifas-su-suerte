<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Su Suerte El Socio</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    background:#f2f2f2;
}

header{
    background:#008000;
    color:white;
    padding:15px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.subtitulo{
    text-align:center;
    padding:10px;
}

.panel{
    width:95%;
    max-width:1200px;
    margin:auto;
}

input{
    width:100%;
    padding:12px;
    font-size:18px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    padding:12px 20px;
    margin:5px;
    font-size:18px;
    cursor:pointer;
    border:none;
    border-radius:8px;
}

.copiar{
    background:#1565c0;
    color:white;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
    gap:8px;
    margin-top:20px;
}

.numero{
    background:white;
    border:1px solid #999;
    padding:10px;
    text-align:center;
    cursor:pointer;
    border-radius:8px;
}

.numero:hover{
    background:#dcedc8;
}

.seleccionado{
    background:#4CAF50;
    color:white;
}

.contador{
    font-size:20px;
    font-weight:bold;
}
</style>

</head>

<body>

<header>
Su Suerte El Socio
</header>

<div class="subtitulo">
Administración de Rifas
</div>

<div class="panel">

<input type="file" id="archivo" accept=".xlsx,.xls,.csv">

<input type="text" id="buscar" placeholder="Buscar número">

<p class="contador">
Seleccionados:
<span id="cantidad">0</span>
</p>

<button class="copiar" onclick="copiar()">
📋 Copiar
</button>

<button class="whatsapp" onclick="enviar()">
📱 WhatsApp
</button>

<div id="numeros" class="grid"></div>

</div>

<script>

let lista=[];
let seleccionados=new Set();

document.getElementById("archivo").addEventListener("change",leerExcel);

function leerExcel(e){

const reader=new FileReader();

reader.onload=function(evt){

const workbook=XLSX.read(evt.target.result,{type:"binary"});

const hoja=workbook.Sheets[workbook.SheetNames[0]];

lista=XLSX.utils.sheet_to_json(hoja,{header:1})
.flat()
.filter(x=>x!="")
.map(x=>String(x).padStart(4,"0"));

mostrar(lista);

}

reader.readAsBinaryString(e.target.files[0]);

}

function mostrar(datos){

const div=document.getElementById("numeros");

div.innerHTML="";

datos.forEach(numero=>{

let b=document.createElement("div");

b.className="numero";

if(seleccionados.has(numero))
b.classList.add("seleccionado");

b.innerHTML=numero;

b.onclick=function(){

if(seleccionados.has(numero)){

seleccionados.delete(numero);

b.classList.remove("seleccionado");

}else{

seleccionados.add(numero);

b.classList.add("seleccionado");

}

document.getElementById("cantidad").innerHTML=seleccionados.size;

}

div.appendChild(b);

});

}

document.getElementById("buscar").addEventListener("keyup",function(){

let texto=this.value;

mostrar(lista.filter(n=>n.includes(texto)));

});

function copiar(){

navigator.clipboard.writeText([...seleccionados].join("\n"));

alert("Números copiados");

}

function enviar(){

let mensaje=[...seleccionados].join("\n");

window.open("https://wa.me/59167723609?text="+encodeURIComponent(mensaje));

}

</script>

</body>
</html>
